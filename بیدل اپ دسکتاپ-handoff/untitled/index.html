  h+='<span class="mood-dom" data-mood="'+data.dom+'">غالب: '+domMood.label+'</span></div>';
  h+= (TWEAKS.moodChart==='bars') ? renderMoodBars(data, (kws||[]).length) : renderMoodRadar(data, (kws||[]).length);
  h+='<div class="mood-hint fa">روی هر حالت بزنید تا واژه‌ها و ابیاتش را ببینید</div>';
  h+='</div>';
  return h;
}
function renderMoodRadar(data, kwCount){
  const N=MOODS.length, cx=150, cy=116, R=70;
  const step=360/N;
  const rings=[0.34,0.67,1];
  const pt=(i,r)=>{ const a=(-90 + i*step)*Math.PI/180; return [cx+R*r*Math.cos(a), cy+R*r*Math.sin(a)]; };
  let s='<div class="mood-radar-wrap"><svg class="mood-radar" viewBox="0 0 300 250" role="img" aria-label="نمودار هفت‌وادیِ حال و هوا">';
  rings.forEach(r=>{
    const pts=MOODS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+='<polygon class="mr-grid" points="'+pts+'"/>';
  });
  MOODS.forEach((_,i)=>{ const [x,y]=pt(i,1); s+='<line class="mr-spoke" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'; });
  const dpts=MOODS.map((m,i)=>pt(i, Math.max(0.08,data.scores[m.id])).map(v=>v.toFixed(1)).join(',')).join(' ');
  s+='<polygon class="mr-area" points="'+dpts+'"/>';
  MOODS.forEach((m,i)=>{
    const a=(-90 + i*step)*Math.PI/180;
    const ux=Math.cos(a), uy=Math.sin(a);            // outward radial direction of this axis
    const [rx,ry]=pt(i,1);                            // its vertex on the outer ring
    const [vx,vy]=pt(i, Math.max(0.08,data.scores[m.id])); // the data point
    const isDom=(m.id===data.dom);
    // Anchor each label just OUTSIDE its own vertex and let it grow further outward.
    // Labels are RTL (Persian): "start" pins the RIGHT edge, "end" pins the LEFT edge —
    // so a right-side label uses "end" (grows right) and a left-side label uses "start"
    // (grows left). Combined with a small radial gap, the text can never re-enter the graph.
    const GAP=8;
    let anchor, lx;
    if(ux > 0.30){ anchor='end';   lx = rx + GAP; }   // right of centre → grow rightward
    else if(ux < -0.30){ anchor='start'; lx = rx - GAP; } // left of centre → grow leftward
    else { anchor='middle'; lx = rx; }                // top / bottom → centred over vertex
    let lyName, lyPct;
    if(uy < -0.30){ lyName = ry - 15; lyPct = ry - 3; }       // upper axes → stack above
    else if(uy > 0.30){ lyName = ry + 17; lyPct = ry + 29; }  // lower axes → stack below
    else { lyName = ry - 2; lyPct = ry + 11; }               // side axes → straddle vertex
    s+='<g class="mood-axis-g" data-mood="'+m.id+'" style="cursor:pointer">';
    s+='<text class="mr-lab'+(isDom?' dom':'')+'" x="'+lx.toFixed(1)+'" y="'+lyName.toFixed(1)+'" text-anchor="'+anchor+'">'+m.label+'</text>';
    s+='<text class="mr-lab-pct" x="'+lx.toFixed(1)+'" y="'+lyPct.toFixed(1)+'" text-anchor="'+anchor+'">٪'+toFa(Math.round(data.scores[m.id]*100))+'</text>';
    s+='<circle class="mr-hit" cx="'+rx.toFixed(1)+'" cy="'+ry.toFixed(1)+'" r="22"/>';
    s+='<circle class="mr-vtx" cx="'+vx.toFixed(1)+'" cy="'+vy.toFixed(1)+'" r="'+(isDom?5:3.5)+'"'+(isDom?' style="fill:var(--sa);stroke:var(--sa2)"':'')+'/>';
    s+='</g>';
  });
  // center: total keyword count
  if(kwCount){
    s+='<text class="mr-center-n" x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle">'+toFa(kwCount)+'</text>';
    s+='<text class="mr-center-lab" x="'+cx+'" y="'+(cy+11)+'" text-anchor="middle">واژهٔ کلیدی</text>';
  }
  s+='</svg></div>';
  return s;
}
function renderMoodBars(data, kwCount){
  const sorted=data.list.slice().sort((a,b)=>b.val-a.val);
  let s='';
  if(kwCount) s+='<div class="mood-bars-count fa">بر پایهٔ <b>'+toFa(kwCount)+'</b> واژهٔ کلیدی</div>';
  s+='<div class="mood-bars">';
  for(const m of sorted){
    const isDom=(m.id===data.dom);
    s+='<div class="mood-bar-row'+(isDom?' mbar-row-dom':'')+'" data-mood="'+m.id+'">';
    s+='<span class="mbar-name">'+m.label+'</span>';
    s+='<span class="mbar-track"><span class="mbar-fill" style="width:'+Math.max(4,Math.round(m.val*100))+'%"></span></span>';
    s+='<span class="mbar-pct fa">٪'+toFa(m.pct)+'</span>';
    s+='</div>';
  }
  s+='</div>';
  return s;
}

async function renderBrowseBody(){
  const body = document.getElementById('browse-body');
  if(!body) return;
  body.innerHTML = '<div class="nr2">در حال بارگذاری…</div>';
  if(browseSub==='z' && !_user){ needsLogin(()=>showBrowse('z')); return; }
  if(browseSub==='g'){
    if(!_listCache.ghazals) _listCache.ghazals=await apiFetch(API_URL+'/poems/ghazals');
    if(!_listCache.ghazals){ body.innerHTML='<div class="er">خطا در بارگذاری</div>'; return; }
    let h='<div class="rh fa">فهرست غزلیات</div>';
    for(const g of _listCache.ghazals){
      const pv=g.first_couplet[0]||'';
      h+='<div class="ri" data-tp="g" data-n="'+g.number+'"><div class="rt fa">غزل '+toFa(g.number)+'</div><div class="rti">'+g.title+'</div><div class="rp">'+pv+'</div></div>';
    }
    body.innerHTML = h;
  } else if(browseSub==='t'){
    if(!_listCache.terjees) _listCache.terjees=await apiFetch(API_URL+'/poems/terjees');
    if(!_listCache.terjees){ body.innerHTML='<div class="er">خطا در بارگذاری</div>'; return; }
    let h='<div class="rh fa">ترجیع‌بند حیرت · '+toFa(TB)+' بند</div>';
    for(const b of _listCache.terjees){
      const prev=b.first_couplet[0]||'';
      h+='<div class="ri tr" data-tp="t" data-n="'+b.number+'"><div class="rt fa">بند '+toFa(b.number)+'</div><div class="rp">'+prev+'</div></div>';
    }
    body.innerHTML = h;
  } else if(browseSub==='z'){
    const sections=await apiFetch(API_URL+'/poems/zand');
    if(!sections){ body.innerHTML='<div class="er">خطا در بارگذاری</div>'; return; }
    let h='<div class="rh fa">زند بیدل · شروین وکیلی</div>';
    for(const z of sections){
      if(!z.has_content) continue;
      h+='<div class="zcard'+(z.type==='bakhsh'?' bakhsh':'')+'" data-zid="'+z.number+'"><div class="zcard-title">'+z.title+'</div></div>';
    }
    body.innerHTML = h;
  }
}

  const IC_COPY='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
  const IC_SHARE='<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

  h+='<div class="acts"><div class="ca">';

function renderKeywordList(){

  if(TWEAKS.sortBy==='alpha') list.sort((a,b)=>a.w.localeCompare(b.w,'fa'));
  else list.sort((a,b)=>b.n-a.n);
  const maxN = Math.max(...all.map(k=>k.n));
  setHeader('کلمات کلیدی', toFa(list.length)+' واژه از ۲۲۲');

  }

async function toggleBm(tp,id,ci){
  if(!isAuthed()){ showAuthModal({type:'bm',tp,id,ci}); return; }
  if(MOCK_MODE){
    const key=bkey(tp,id,ci);
    const _adding=!_bms[key];
    if(_bms[key]){ delete _bms[key]; }
    else{
      const poem=_poemCache[tp+'_'+id];
      const c=poem?(poem.couplets[ci]||['','']):['',''];
      const ti2=tp==='g'?(poem?.title||''):'بند '+id;
      _bms[key]={tp,id,ci,ti2,c};
    }
    _saveMockBms();
    updateBmBadge();
    const _sc=ctEl.scrollTop;
    if(tp==='g') await showG(cg); else await showT(ct);
    ctEl.scrollTop=_sc;
    showToast(_adding?'به نشان‌های من افزوده شد':'از نشان‌ها حذف شد');
    return;
  }
  const resp=await fetch(API_URL+'/bookmarks',{method:'POST',headers:authHeaders(),body:JSON.stringify({poem_type:tp,poem_id:id,couplet_index:ci})});
  if(resp.status===401){setToken(null);_saveUser(null);showAuthModal({type:'bm',tp,id,ci});return;}
  await loadUserData();
  const _added=!!_bms[bkey(tp,id,ci)];
  const _sc2=ctEl.scrollTop;
  if(tp==='g') await showG(cg); else await showT(ct);
  ctEl.scrollTop=_sc2;
  showToast(_added?'به نشان‌های من افزوده شد':'از نشان‌ها حذف شد');
}

async function saveProfileEdit(){

async function doSrch(){
  const inp = document.getElementById('srch-input');
  const raw = inp ? inp.value.trim() : ''; if(!raw) return;
  const resultsEl = document.getElementById('srch-results');
  if(!resultsEl) return;
  resultsEl.innerHTML = '<div class="nr2">در حال جستجو…</div>';

  const persianMap={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  const normalized=raw.trim().replace(/[۰-۹]/g,d=>persianMap[d]);
  const num=parseInt(normalized);
  if(!isNaN(num) && num>0 && String(num)===normalized){
    if(num>=1 && num<=TOT){ showG(num); return; }
    if(num>=1 && num<=TB){ showT(num); return; }
    resultsEl.innerHTML='<div class="nr2">شماره '+toFa(num)+' یافت نشد</div>';
    return;
  }

  const kw=raw;
  const allKw = window.KEYWORDS || [];
  const exactKw = allKw.filter(k=>k.w===kw);
  const partialKw = allKw.filter(k=>k.w!==kw && (k.w.indexOf(kw)!==-1 || kw.indexOf(k.w)!==-1));
  const kwMatches = [...exactKw, ...partialKw].slice(0,3);
  const [rg,rt]=await Promise.all([
    apiFetch(API_URL+'/poems/search?q='+encodeURIComponent(kw)+'&type=g'),
    apiFetch(API_URL+'/poems/search?q='+encodeURIComponent(kw)+'&type=t'),
  ]);
  const rgX = rg||{results:[]}, rtX = rt||{results:[]};
  const ms=[];
  for(const r of (rgX.results||[])){
    const c=r.matches[0]?.couplet||['',''];
    ms.push({tp:'g',n:r.number,ti2:r.title,pv:c[0]+(c[1]?' / '+c[1]:'')});
  }
  for(const r of (rtX.results||[])){
    const c=r.matches[0]?.couplet||['',''];
    ms.push({tp:'t',n:r.number,ti2:'بند '+toFa(r.number),pv:c[0]+(c[1]?' / '+c[1]:'')});
  }
  if(!ms.length && !kwMatches.length){resultsEl.innerHTML='<div class="nr2">«'+kw+'» یافت نشد</div>';return}
  let h='<div class="rh fa">'+toFa(ms.length)+' نتیجه برای «'+kw+'»'+(kwMatches.length?' · '+toFa(kwMatches.length)+' واژه':'')+'</div>';
  for(const k of kwMatches){
    const numGh = Math.round(k.n/4.27);
    const meanShort = k.mean.length>70 ? k.mean.slice(0,70)+'…' : k.mean;
    h += '<div class="ri kw" data-kwword="'+k.w+'">';
    h += '<div class="rt fa">واژه · '+window.CATEGORY_LABEL[k.cat]+'</div>';
    h += '<div class="rti-row"><span class="rti">'+hl(k.w,kw)+'</span><span class="rti-count fa">'+toFa(k.n)+' بار · '+toFa(numGh)+' غزل</span></div>';
    h += '<div class="rp">'+meanShort+'</div></div>';
  }
  for(const m of ms){
    h+='<div class="ri'+(m.tp==='t'?' tr':'')+'" data-tp="'+m.tp+'" data-n="'+m.n+'" data-kw="'+kw+'">';
    if(m.tp==='t') h+='<div class="rt fa">ترجیع‌بند</div>';
    h+='<div class="rti">'+m.ti2+'</div><div class="rp">'+hl(m.pv,kw)+'</div></div>';
  }
  resultsEl.innerHTML = h;
}

    return;
  }
  // Keyword filter chip
  const fc = e.target.closest('.kw-chip');
  if(fc){ _kwFilter = fc.dataset.kwfilter; renderKeywordList(); return; }
  // Keyword card
  const kc = e.target.closest('.kw-card');
  if(kc){ showKeyword(kc.dataset.kwword); return; }
  // Tag inside ghazal/search
  const gtag = e.target.closest('.gkw');
  if(gtag){ showKeyword(gtag.dataset.kwword); return; }
  // Keyword inside search results
  const kwr = e.target.closest('.ri.kw');
  if(kwr){ showKeyword(kwr.dataset.kwword); return; }
  // Zand section
  const zc = e.target.closest('.zcard');
  if(zc){ showZand(parseInt(zc.dataset.zid)); return; }
  // Result item
  const ri = e.target.closest('.ri');
  if(ri && !e.target.closest('button')){
    const kw=ri.dataset.kw||'';
    if(ri.dataset.tp==='g'){ showG(parseInt(ri.dataset.n),kw); }
    else if(ri.dataset.tp==='t'){ showT(parseInt(ri.dataset.n),kw); }

  // Bookmark item

    if(bi.dataset.tp==='g'){ showG(parseInt(bi.dataset.id)); }
    else{ showT(parseInt(bi.dataset.id)); }
    return;
  }
  // Delete bookmark
  if(e.target.closest('.bdl')){
    const k=e.target.closest('.bdl').dataset.key;
    const p2=k.split('_');
    toggleBm(p2[0],parseInt(p2[1]),parseInt(p2[2]));
    return;
  }
  // Share whole ghazal/band from the poem-meta card
  const psh=e.target.closest('.pshare');
  if(psh){ const pp=psh.dataset.pshare.split('_'); openShareGhazal(pp[0], parseInt(pp[1])); return; }
  // Couplet buttons
  const btn=e.target.closest('.ca button');
  const cp=e.target.closest('.cp');
  const nd=e.target.closest('.nd');
  if(!cp) return;

  if(nd && !btn){ openModal(key, getVerse(tp,id,ci)); return; }

    const wasOpen=cp.classList.contains('open');
    ctEl.querySelectorAll('.cp.open').forEach(c=>{ if(c!==cp) c.classList.remove('open'); });

  const action=btn.dataset.action;
  if(action==='bm'){ toggleBm(tp,id,ci); return; }
  if(action==='note'){ openModal(key, getVerse(tp,id,ci)); return; }
  if(action==='share'){ openShare(tp,id,ci); return; }
  if(action==='copy'){
    const [m1,m2]=getCouplet(tp,id,ci);
    const txt=m1+(m2?'\n'+m2:'');
    const el=document.createElement('div');
    el.contentEditable=true;
    el.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden;opacity:0.01;white-space:pre;';
    el.innerText=txt; document.body.appendChild(el);
    const sel=window.getSelection(), range=document.createRange();
    range.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(range);
    try{document.execCommand('copy');}catch(e){}
    sel.removeAllRanges(); document.body.removeChild(el);
    const lab=btn.querySelector('.cal')||btn; const o=lab.textContent; lab.textContent='کپی شد ✓'; setTimeout(()=>lab.textContent=o,1000);
    showToast('بیت کپی شد');
  }
});

function _copyFallback(t){ try{const el=document.createElement('textarea');el.value=t;el.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();}catch(e){} }
function copyTextTo(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>_copyFallback(t)); return; } }catch(e){} _copyFallback(t); }
function openShare(tp,id,ci){

  const seg = tp==='g'?'g':'t';
  const path = 'bideli.app/'+seg+'/'+id+'/'+(ci+1);
  _shData={ url:'https://'+path, text:(m1+(m2?' / '+m2:''))+' — بیدل دهلوی' };
  document.getElementById('sh-t').textContent='اشتراکِ بیت '+toFa(ci+1);
  document.getElementById('sh-v').textContent=m1;
  document.getElementById('sh-url').textContent=path;
  shbg.classList.add('open');
}
function openShareGhazal(tp,id){
  const seg = tp==='g'?'g':'t';
  const poem=_poemCache[tp+'_'+id];
  const title = tp==='g'?(poem?.title||'') : '';
  const path='bideli.app/'+seg+'/'+id;
  _shData={ url:'https://'+path, text:(tp==='g'?('غزل '+toFa(id)+(title?' «'+title+'»':'')):('ترجیع‌بند حیرت · بند '+toFa(id)))+' — بیدل دهلوی' };
  document.getElementById('sh-t').textContent = tp==='g'?('اشتراکِ غزل '+toFa(id)):('اشتراکِ بند '+toFa(id));
  document.getElementById('sh-v').textContent = tp==='g'?(title||('غزل '+toFa(id))):('ترجیع‌بند حیرت');
  document.getElementById('sh-url').textContent=path;
  shbg.classList.add('open');
}
function cshare(){ shbg.classList.remove('open'); _shData=null; }
document.getElementById('sh-copy').addEventListener('click',()=>{
  if(_shData) copyTextTo(_shData.url);
  showToast('لینک کپی شد');
  const b=document.getElementById('sh-copy'); const o=b.textContent; b.textContent='کپی شد ✓'; setTimeout(()=>{b.textContent=o;},1300);
});
document.getElementById('sh-share').addEventListener('click',()=>{
  if(!_shData) return;
  if(navigator.share){ navigator.share({title:'بیدلی',text:_shData.text,url:_shData.url}).catch(()=>{}); }
  else { copyTextTo(_shData.url); showToast('لینک کپی شد'); const b=document.getElementById('sh-share'); const sp=b.querySelector('span'); const o=sp.textContent; sp.textContent='لینک کپی شد ✓'; setTimeout(()=>{sp.textContent=o;},1300); }
});
shbg.addEventListener('click', e=>{ if(e.target===shbg) cshare(); });

// ─── MOOD SHEET EVENTS ───────────────────
moodSheetBg.addEventListener('click', e=>{
  if(e.target===moodSheetBg){ closeMoodSheet(); return; }
  const kw=e.target.closest('.gkw');
  if(kw){ closeMoodSheet(); showKeyword(kw.dataset.kwword); return; }
  const ov=e.target.closest('.ms-ov-row');
  if(ov){ openMoodSheet(ov.dataset.mood); return; }
  const cp=e.target.closest('.ms-cp');
  if(cp){
    const ci=parseInt(cp.dataset.ci);
    closeMoodSheet();
    setTimeout(()=>{
      const el=ctEl.querySelector('.cp[data-key="'+bkey('g',cg,ci)+'"]');
      if(el){ ctEl.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:'smooth'}); el.classList.add('cp-flash'); setTimeout(()=>el.classList.remove('cp-flash'),1400); }
    },230);
    return;
  }
});

// ─── AUTH ────────────────────────────────
function addTap(id, handler){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',function(e){e.preventDefault();handler();},{passive:false});
  el.addEventListener('click',handler);
}

function _runPending(){
  const p = _pendingAction; _pendingAction=null;
  if(typeof p === 'function'){ p(); return; }
  if(!p){
    // refresh current view if profile
    if(curView==='profile') showProfile();
    return;
  }
  if(p.type==='bm'){ toggleBm(p.tp, p.id, p.ci); return; }
  if(p.type==='note'){
    // restore the note draft and re-open save flow
    const k = bkey(p.tp,p.id,p.ci);
    if(p.text){
      _nts[k] = p.text;
      _saveMockBms();
    }
    if(curView==='gh') showG(cg);
    else if(curView==='tr') showT(ct);
    return;
  }
}

// ─── TWEAKS PANEL ────────────────────────
const twPanel = document.getElementById('tw-panel');
function setTweak(key, val){
  TWEAKS[key] = val;
  twPanel.querySelectorAll('[data-tweak="'+key+'"] button').forEach(b=>{
    b.classList.toggle('on', b.dataset.v===val);
  });
  try{ window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[key]:val}}, '*'); }catch(e){}
  if(curView==='kw') renderKeywordList();
  else if(curView==='gh' && cg) showG(cg);
}
function openTweaks(){ twPanel.classList.add('open'); }
function closeTweaks(){ twPanel.classList.remove('open'); try{ window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); }catch(e){} }
twPanel.addEventListener('click', e=>{
  const b = e.target.closest('button[data-v]');
  if(b){ const key = b.parentElement.dataset.tweak; setTweak(key, b.dataset.v); }
});
document.getElementById('tw-close').addEventListener('click', closeTweaks);
window.addEventListener('message', e=>{
  const d = e.data||{};
  if(d.type==='__activate_edit_mode') openTweaks();
  else if(d.type==='__deactivate_edit_mode') closeTweaks();
});
try{ window.parent.postMessage({type:'__edit_mode_available'}, '*'); }catch(e){}

// ─── BOOT ────────────────────────────────
_loadMockBms();
_loadSeen();
loadUserData();
showHome();

window.__bidel={saveUser:_saveUser,runPending:_runPending,setPending:v=>{_pendingAction=v},refresh:()=>{if(curView==='home')showHome()},setMock:()=>{MOCK_MODE=true}};
})();
</script>
</body>
</html>
